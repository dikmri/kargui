# 送るたびに、Windows・Linux・macOS で試験を走らせる。
# - Windows: 全部の試験と検査（説明と例の割合・部品の写真・AI 向けの索引・ガイドの古さ）、Windows 以外の文字の道の試験
# - Linux・macOS: kargui の試験（部品・並べ方・描き方・試験台・文字）
# - macOS の窓: 見本を本物の窓で開き、窓に出した絵を写真に残す。外から本物のマウスとキーの入力も送る（作者は Mac を
#   持たないので、macOS の窓と入力はここで確かめる）
# macos ブランチは macOS の作りかけの作業用（作者の許可で、毎回聞かずに送る）
name: ci

on:
  push:
    branches: [main, macos]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Tests (DirectWrite text)
        run: cargo test --locked --workspace --exclude kargui-spike
      - name: Tests (portable text, the same path as Linux and macOS)
        run: cargo test --locked -p kargui --features portable-text --lib
      - name: Documentation checks
        run: cargo run --locked -p xtask -- check
      # docs.rs に載る説明を、注意（壊れたリンクなど）なしで作れるか
      - name: API docs without warnings
        run: cargo doc --locked -p kargui --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fontconfig の開発用ファイルは、parley の中の fontique が OS のフォントを探すのに使う（組み立ての時に要る）
      - name: Japanese fonts and fontconfig
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk libfontconfig1-dev pkg-config
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Tests
        run: cargo test --locked -p kargui

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Tests
        run: cargo test --locked -p kargui

  # 見本を本物の窓で開き、kargui が窓に出した絵（KARGUI_SHOT）と、画面の写真（screencapture。許可が無いと窓が
  # 写らないことがある）を残す。写真と記録は artifact（macos-window）で取り出す
  macos-window:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the examples
        run: cargo build --locked --release -p gallery-kargui -p expenses-kargui
      - name: Open the examples and save what they drew
        run: |
          mkdir -p shots
          sw_vers > shots/system.txt
          uname -m >> shots/system.txt
          system_profiler SPDisplaysDataType > shots/displays.txt 2>&1 || true
          shot() {
            name="$1"; shift
            KARGUI_SHOT="shots/$name.png" KARGUI_SHOT_MS=3000 "$@" --log "shots/$name.log" &
            pid=$!
            ( sleep 30; kill "$pid" 2>/dev/null && echo "$name: killed after 30 s" ) &
            sleep 2
            screencapture -x "shots/$name-screen.png" || echo "$name: screencapture failed"
            wait "$pid"; echo "$name: exit=$?"
          }
          shot gallery ./target/release/gallery-kargui
          shot gallery-dark ./target/release/gallery-kargui --dark
          GALLERY_PAGE=13 shot gallery-dates ./target/release/gallery-kargui --light
          shot expenses ./target/release/expenses-kargui
          ls -la shots
      # 本物のマウスとキーの入力（CGEvent）を外から送り、kargui が受け取って描き直すかを確かめる（道具は tools/ci/mac-drive.swift）。
      # 座標は窓の中の左上からの論理ピクセル（見本の配置。Windows と同じ）
      - name: Build the input driver
        run: xcrun swiftc -O tools/ci/mac-drive.swift -o target/mac-drive
      - name: Drive the examples with a real mouse and keyboard
        run: |
          drive() {
            name="$1"; height="$2"; app="$3"; shift 3
            KARGUI_SHOT="shots/$name.png" KARGUI_SHOT_MS="${SHOT_MS:-12000}" "$app" --log "shots/$name.log" &
            pid=$!
            ( sleep 40; kill "$pid" 2>/dev/null && echo "$name: killed after 40 s" ) &
            sleep 2
            ./target/mac-drive "$pid" "$height" "$@" > "shots/$name-drive.txt" 2>&1 || echo "$name: driver exit=$?"
            sleep 1
            screencapture -x "shots/$name-screen.png" || echo "$name: screencapture failed"
            wait "$pid"; echo "$name: exit=$?"
          }
          # 暗い色のボタンを押す（中身と題の帯が暗くなる）・左の一覧をホイールで下へ送る・一覧の行に乗る
          drive input-gallery 620 ./target/release/gallery-kargui click:129,28 wait:300 wheel:120,400,-5 wait:300 move:120,300
          # 金額の欄で全部を選んで 1234 を打ち Enter・上の矢印で 100 足す・メモに tesx と打って 1 字消して t と あ・日付が無いまま追加を押す
          drive input-expenses 600 ./target/release/expenses-kargui click:90,72 key:cmd+a type:1234 key:enter click:149,72 click:500,72 type:tesx key:backspace type:t type:あ click:43,116 wait:300
          # 窓の仕組み: 表の行の右クリックのメニュー（キーで選ぶ）・クリップボード（Command+C・V）・ダブルクリック・
          # 中身の右下の角を引っ張って大きさを変える（引っ張っている途中も描き直すか、押下が部品に届かないかを見る。
          # 角の外 2 ポイントの所は、AppKit が大きさを変える所に入らなかった）・題の帯を引っ張って窓を動かす・閉じる
          # ボタン（アプリが閉じてよいと答えて終わる。写真の時刻より先に押すため、写真は 30 秒後）
          SHOT_MS=30000 drive input-window 600 ./target/release/expenses-kargui rclick:250,311 wait:300 screen:shots/input-window-menu.png key:down key:enter wait:300 click:500,72 type:ab key:cmd+a key:cmd+c key:right key:cmd+v dclick:325,72 wait:300 bounds down:718,598 dragto:818,628 wait:300 screen:shots/input-window-resizing.png up:818,628 wait:500 bounds screen:shots/input-window-resized.png down:360,-16 dragto:260,-6 up:260,-6 wait:500 bounds screen:shots/input-window-moved.png click:16,-16 wait:800
          # 日本語入力: メモ欄で日本語のローマ字入力に切り替え、nihongo を本物のキーで打ち（変換中）、スペースで変換、
          # Enter で確定する。英字に戻して ok と打つ（メモ欄は「日本語ok」になるはず）。別のプロセスから入力ソースを
          # 切り替えると、メニューバーの表示は変わっても前面のアプリの入力の受け手は前のままなので（1 回目は nihongo と
          # 入った）、デスクトップを押してから欄を押し直し、焦点を移して戻す
          drive input-ime 600 ./target/release/expenses-kargui click:500,72 inputsource:com.apple.inputmethod.Kotoeri.RomajiTyping.Japanese wait:300 click:-100,300 wait:500 click:500,72 wait:500 type:nihongo wait:500 screen:shots/input-ime-preedit.png key:space wait:800 screen:shots/input-ime-converted.png key:enter wait:500 inputsource:com.apple.keylayout.ABC type:ok wait:300
          # テキストエディットでは同じ手順で「日本語」に変換できた（2026-11-28）。kargui の見本は cargo が作った裸の
          # 実行ファイルで、アプリの束（.app と Info.plist の bundle identifier）が無い。束に入れた物でも同じ手順で比べる
          mkdir -p target/Expenses.app/Contents/MacOS
          cp target/release/expenses-kargui target/Expenses.app/Contents/MacOS/
          cat > target/Expenses.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>io.github.dikmri.kargui.expenses</string>
          <key>CFBundleExecutable</key><string>expenses-kargui</string>
          <key>CFBundleName</key><string>Expenses</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          drive input-ime-bundle 600 ./target/Expenses.app/Contents/MacOS/expenses-kargui click:500,72 inputsource:com.apple.inputmethod.Kotoeri.RomajiTyping.Japanese wait:800 type:nihongo wait:500 screen:shots/input-ime-bundle-preedit.png key:space wait:800 screen:shots/input-ime-bundle-converted.png key:enter wait:500 inputsource:com.apple.keylayout.ABC type:ok wait:300
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-window
          path: shots
