[package]
name = "kargui-spike"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "段階 0 の試作。空に近い窓を Direct3D 11 と CPU の 2 つの道で描き、起動・メモリ・CPU・日本語入力・読み上げを確かめる"

[dependencies]
taskcore = { path = "../taskcore" }
accesskit = "=0.25.2"
accesskit_windows = "=0.35.2"
windows-core = "=0.62.2"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
