[workspace]
resolver = "3"
members = ["crates/kargui", "examples/taskbook", "examples/hello", "examples/settings", "examples/reader", "examples/table", "taskcore", "spike", "probes/text-probe", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

# 前回の比べ（Tauri・egui・GPUI）と同じリリースの設定
[profile.release]
lto = true
codegen-units = 1
strip = true
