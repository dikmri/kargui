[package]
name = "kargui"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A light native GUI framework for Rust on Windows and Linux: immediate-mode code, CPU rendering that redraws only what changed, input methods and screen readers built in"
readme = "../../README.md"
repository = "https://github.com/dikmri/kargui"
keywords = ["gui", "windows", "linux", "ime", "accessibility"]
categories = ["gui"]

# 公開の API はどの OS でも同じなので、docs.rs は Windows 向けだけ作る（Linux 向けは fontconfig の開発用ファイルが要る）
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[features]
# Windows でも、Windows 以外の文字の道（parley・swash）を使う。Windows の上で、Linux や macOS と同じ文字の道の
# 試験を走らせるため（cargo test -p kargui --features portable-text）
portable-text = ["dep:parley", "dep:swash"]

# どの OS でも使う物（部品・並べ方・描き方・試験台）
[dependencies]
accesskit = "=0.25.2"
# 入力欄で 1 文字を書記素（結合文字・絵文字の並び）で数える。MIT/Apache-2.0、依存なし
unicode-segmentation = "=1.12.0"

# Windows 以外の文字の道: 並べる（折り返し・代わりのフォント・当たり判定）のは parley、OS のフォントを探すのは
# parley に入っている fontique、形を作るのは swash。どれも MIT/Apache-2.0
[target.'cfg(not(windows))'.dependencies]
parley = "=0.12.0"
swash = "=0.2.10"

# OS との境目の Linux の版（窓・入力。wayland.rs）。低い層の wayland-client と protocols を直接使う
# （smithay-client-toolkit は依存が 57 個で、組み立てに libxkbcommon-dev と pkg-config が要る）。キー配列は動く時に
# libxkbcommon.so を読む xkbcommon-dl（組み立てに開発用の部品が要らない）。memfd・mmap・poll・eventfd は rustix。
# どれも MIT（rustix は Apache-2.0 か MIT）
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
xkbcommon-dl = { version = "=0.4.2", features = ["x11"] }
rustix = { version = "=1.1.6", features = ["fs", "mm", "event", "pipe"] }
# 読み上げの橋渡し（AT-SPI を D-Bus で話す。D-Bus は zbus、自分のスレッドで async-io を回す）。MIT/Apache-2.0。
# Linux の依存はこれで 71 個増える（zbus・AT-SPI の型・async の部品）。読み上げは kargui の最初からの約束なので入れる
accesskit_unix = "=0.24.1"
# ファイルのダイアログと明暗の設定（xdg-desktop-portal）。accesskit_unix が使う zbus と同じ物を、同期の呼び方
# （blocking-api。手続きマクロの機能が 1 つ増えるだけで、依存は増えない）で使う。MIT
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# X11 の窓（x11.rs）。libxcb は動く時に読む（dl-libxcb。組み立てに開発用の部品が要らない）。libxcb の接続にするのは、
# X サーバーのキー配列をそのまま読む libxkbcommon-x11 が libxcb の接続を受け取るため（XWayland のキー配列は合成から
# 来るので、名前から作ったキー配列では合わないことがある）。絵は MIT-SHM（無ければ PutImage）、ポインターの形は
# カーソルの組（xcursor）、倍率は Xft.dpi（resource_manager）。増えるのは 5 個。MIT/Apache-2.0
x11rb = { version = "=0.14.0", default-features = false, features = ["allow-unsafe-code", "dl-libxcb", "xkb", "shm", "cursor", "resource_manager"] }

# OS との境目（窓・入力・日本語入力・文字・画面に出す・クリップボード・読み上げの橋渡し）の Windows の版
# OS との境目の macOS の版（窓・入力・画面に出す。macos.rs）。AppKit を objc2 で呼ぶ。書体を探す fontique（parley の
# 中）が objc2 0.6・objc2-foundation 0.3 の世代を使うので、同じ世代にそろえる（増えるのは app-kit と core-graphics）。
# 既定の機能（全部の型）は切り、使う型だけを選ぶ。どれも MIT か Apache-2.0
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDate", "NSGeometry", "NSObject", "NSThread", "NSRunLoop", "NSArray", "NSNotification", "NSAttributedString", "NSRange", "NSBundle", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSEvent", "NSGraphics", "NSPasteboard", "NSAppearance", "NSScreen", "NSGraphicsContext", "NSTextInputClient", "NSTextInputContext", "NSAttributedString", "NSPanel", "NSSavePanel", "NSOpenPanel", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGDataProvider"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = "=0.35.2"
windows-core = "=0.62.2"
parley = { version = "=0.12.0", optional = true }
swash = { version = "=0.2.10", optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    # 通知（トースト。toast_win.rs）
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
]
